version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres_db:
    image: postgres:15-alpine
    container_name: terasmart_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-terasmart_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-TeraSmartSecurePass2026!}
      POSTGRES_DB: ${DB_NAME:-terasmart_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-terasmart_admin} -d ${DB_NAME:-terasmart_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API Service
  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terasmart_api
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-terasmart_admin}
      DB_PASSWORD: ${DB_PASSWORD:-TeraSmartSecurePass2026!}
      DB_NAME: ${DB_NAME:-terasmart_db}
      JWT_SECRET: ${JWT_SECRET:-TeraSmart_JWT_Secret_Production_2026}
      PROMPTPAY_ID: ${PROMPTPAY_ID:-0820761709}
      MERCHANT_RECEIVER_BANK: ${MERCHANT_RECEIVER_BANK:-ธนาคารกรุงไทย}
      BANK_ACCOUNT_NO: ${BANK_ACCOUNT_NO:-6608200153}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-oppo0620255009@gmail.com}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads

  # 3. Nginx Web Server & Reverse Proxy
  nginx_server:
    image: nginx:alpine
    container_name: terasmart_nginx
    restart: always
    depends_on:
      - backend_api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
      - certbot_etc:/etc/letsencrypt

volumes:
  postgres_data:
  certbot_etc:
